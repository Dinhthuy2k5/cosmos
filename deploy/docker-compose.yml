services:
  web:
    image: nginx:alpine
    container_name: cosmos-web
    restart: unless-stopped
    volumes:
      - /home/ubuntu/cosmos-web/dist:/usr/share/nginx/html:ro
      - /home/ubuntu/cosmos-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iaa-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=iaa_default" # ← THÊM dòng này (chỉ định network)
      - "traefik.http.routers.cosmos.entrypoints=websecure"
      - "traefik.http.routers.cosmos.rule=Host(`cosmos0.duckdns.org`)"
      - "traefik.http.routers.cosmos.tls=true"
      - "traefik.http.routers.cosmos.tls.certresolver=myresolver"
      - "traefik.http.services.cosmos.loadbalancer.server.port=80"

networks:
  iaa-network:
    external: true
    name: iaa_default
