services:
  web:
    image: nginx:alpine
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${REMOTE_DIR}/dist:/usr/share/nginx/html:ro
      - ${REMOTE_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${CONTAINER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${CONTAINER_NAME}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${CONTAINER_NAME}.tls=true"
      - "traefik.http.routers.${CONTAINER_NAME}.tls.certresolver=myresolver"
      - "traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=80"
      - "traefik.http.middlewares.${CONTAINER_NAME}-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${CONTAINER_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${CONTAINER_NAME}-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${CONTAINER_NAME}-http.middlewares=${CONTAINER_NAME}-redirect"

networks:
  traefik-net:
    external: true
    name: ${TRAEFIK_NETWORK}
